<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>棒人間は正直</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3ecdc;
    --paper-deep: #e9dfc9;
    --ink: #2a2420;
    --ink-soft: #7a6c5c;
    --line: #cdbfa4;
    --shu: #b5412b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Yuji Syuku", "Klee One", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* 上:縦2分割 */
  #stage { flex: 1; min-height: 0; display: flex; }
  #tailPane {
    position: relative; flex: 0 0 38%;
    background: var(--paper-deep);
    border-right: 1px solid #cdbfa4;
  }
  #tail { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #gear {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid #cdbfa4; background: var(--paper); color: var(--ink-soft);
    font-size: 20px; line-height: 1; cursor: pointer; font-family: inherit;
  }
  #chat {
    flex: 1; min-width: 0; height: 100%;
    writing-mode: vertical-rl; text-orientation: mixed;
    overflow-x: auto; overflow-y: hidden;
    padding: 18px 14px;
    font-size: 21px; line-height: 1.9; letter-spacing: 0.06em;
    overscroll-behavior: contain;
  }
  .msg { margin: 0 0 0 1.1em; max-height: 100%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { color: var(--ink-soft); padding-top: 2.2em; font-size: 0.86em; }
  .msg.ai { color: var(--ink); }
  .msg.ai::before { content: "〇"; color: var(--shu); font-size: 0.6em; margin-bottom: 0.5em; display: inline-block; }
  .msg.wait { color: var(--ink-soft); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }

  /* 下:横書きの入力 */
  #status {
    display: none; padding: 6px 12px; font-size: 13px; color: var(--shu);
    font-family: system-ui, sans-serif; background: var(--paper); border-top: 1px solid #cdbfa4;
  }
  #bar {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid #cdbfa4; background: var(--paper);
  }
  #input {
    flex: 1; min-width: 0; resize: none; max-height: 96px;
    padding: 10px 14px; border-radius: 20px; border: 1px solid #cdbfa4;
    background: #fbf7ee; color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Noto Sans JP", sans-serif;
    outline: none;
  }
  #input:focus { border-color: var(--ink-soft); }
  #send {
    flex: 0 0 44px; height: 44px; border-radius: 50%; border: 0;
    background: var(--ink); color: var(--paper); font-size: 20px; cursor: pointer;
  }
  #send:disabled { opacity: 0.35; }

  /* 設定 */
  #veil {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: rgba(42, 36, 32, 0.45); align-items: flex-end; justify-content: center;
  }
  #veil.open { display: flex; }
  #sheet {
    width: 100%; max-width: 520px; max-height: 88%; overflow-y: auto;
    background: var(--paper); border-radius: 18px 18px 0 0; padding: 18px 18px 26px;
    font: 15px/1.7 system-ui, -apple-system, "Noto Sans JP", sans-serif; color: var(--ink);
  }
  #sheet h2 { font: 20px "Yuji Syuku", serif; margin: 0 0 4px; }
  #sheet h3 { font-size: 14px; margin: 18px 0 6px; color: var(--ink-soft); font-weight: 600; }
  #sheet p, #sheet ol { margin: 4px 0; }
  #sheet ol { padding-left: 1.4em; }
  #sheet a { color: var(--shu); }
  #sheet input[type=text], #sheet input[type=password] {
    width: 100%; padding: 10px 12px; font-size: 16px; border-radius: 10px;
    border: 1px solid #cdbfa4; background: #fbf7ee; color: var(--ink);
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .btn {
    padding: 9px 14px; border-radius: 10px; border: 1px solid #cdbfa4;
    background: #fbf7ee; color: var(--ink); font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .btn.main { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .note { font-size: 13px; color: var(--ink-soft); }
  #brain { font-size: 13px; color: var(--ink-soft); }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="tailPane">
      <button id="gear" aria-label="設定">⚙</button>
      <canvas id="tail"></canvas>
    </div>
    <div id="chat" aria-live="polite"></div>
  </div>
  <div id="status"></div>
  <form id="bar">
    <textarea id="input" rows="1" placeholder="話しかける" autocomplete="off"></textarea>
    <button id="send" type="submit" aria-label="送信">↑</button>
  </form>
</div>

<div id="veil">
  <div id="sheet">
    <h2>設定</h2>
    <p id="brain"></p>

    <h3>Gemini APIキー</h3>
    <input id="key" type="password" placeholder="ここに貼り付け" autocomplete="off">
    <div class="row">
      <button class="btn main" id="saveKey" type="button">保存</button>
      <button class="btn" id="delKey" type="button">キーを消す</button>
    </div>
    <p class="note">キーはこの端末のブラウザの中だけに保存され、作者には届きません。</p>

    <h3>キーの取り方(無料)</h3>
    <ol>
      <li><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio のキー画面</a>を開く</li>
      <li>Googleアカウントでログインする</li>
      <li>「APIキーを作成」を押す</li>
      <li>出てきた文字列をコピーして、上の欄に貼る</li>
    </ol>
    <p class="note">無料枠では、会話の内容がGoogleのサービス改善に使われることがあります。人に知られたくないことは書かないでください。</p>

    <h3>モデル名</h3>
    <input id="model" type="text" autocomplete="off">
    <p class="note">ふつうは変えなくて大丈夫です。「モデルが見つからない」と出たときだけ、新しい名前に書き換えます。</p>

    <h3>姿</h3>
    <div class="row" id="formRow"></div>

    <h3>動きを試す</h3>
    <div class="row" id="tryRow"></div>

    <h3>会話</h3>
    <div class="row">
      <button class="btn" id="clear" type="button">会話を消す</button>
      <button class="btn main" id="close" type="button">閉じる</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- 保存(使えないときは黙ってメモリだけで動く) ---------- */
  var mem = {};
  function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return k in mem ? mem[k] : d; } }
  function save(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }
  function drop(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }

  var DEFAULT_MODEL = "gemini-3.5-flash-lite";
  /* 以前の初期値(混雑しやすく、無料枠の回数も少ない)が保存されていたら新しい初期値へ */
  if (load("shippo.model", "") === "gemini-3.8-flash") drop("shippo.model");
  var GREETING = "こんにちは。何でもお話しください。";
  var msgs = [];
  try { msgs = JSON.parse(load("bou.msgs", "[]")) || []; } catch (e) { msgs = []; }

  var $ = function (id) { return document.getElementById(id); };
  var chat = $("chat"), input = $("input"), sendBtn = $("send"), statusEl = $("status");

  /* ---------- 姿(棒人間・犬・花) ---------- */
  var MOODS = { calm: { label: "平常" }, happy: { label: "うれしい" }, surprised: { label: "驚き" }, annoyed: { label: "イライラ" },
                curious: { label: "興味" }, sad: { label: "しょんぼり" }, relaxed: { label: "くつろぎ" }, thinking: { label: "考え中" } };
  var FORM_LABEL = { stick: "棒人間", dog: "犬", flower: "花" };
  var POSES = {
    /* 棒人間:角度は「真下が0、右向きが正」。th/sh=もも/すね、ua/fa=上腕/前腕 */
    stick: {
      calm:      { torso: 0,    head: 0,    hd: 0,     uaL: -0.34, faL: -0.2,  uaR: 0.34, faR: 0.2,   thL: -0.2,  shL: -0.1,  thR: 0.2,  shR: 0.1 },
      happy:     { torso: 0,    head: 0,    hd: 0,     uaL: -2.45, faL: -2.85, uaR: 2.45, faR: 2.85,  thL: -0.22, shL: -0.1,  thR: 0.22, shR: 0.1 },
      surprised: { torso: -0.05, head: -0.05, hd: -0.1, uaL: -1.85, faL: -2.5,  uaR: 1.85, faR: 2.5,   thL: -0.5,  shL: -0.3,  thR: 0.5,  shR: 0.3 },
      annoyed:   { torso: 0,    head: 0,    hd: 0.06,  uaL: -0.4,  faL: 1.3,   uaR: 0.4,  faR: -1.3,  thL: -0.12, shL: -0.05, thR: 0.15, shR: 0.05 },
      curious:   { torso: 0.3,  head: 0.3,  hd: 0,     uaL: -0.1,  faL: -0.3,  uaR: 0.35, faR: 0.2,   thL: -0.1,  shL: -0.05, thR: 0.22, shR: 0.1 },
      sad:       { torso: 0.12, head: 0.28, hd: 0.2,   uaL: -0.14, faL: -0.04, uaR: 0.2,  faR: 0.1,   thL: -0.22, shL: 0.12,  thR: 0.22, shR: -0.12 },
      relaxed:   { torso: 0,    head: 0,    hd: 0.03,  uaL: -0.55, faL: -0.75, uaR: 0.55, faR: 0.75,  thL: -1.35, shL: 1.15,  thR: 1.35, shR: -1.15 },
      thinking:  { torso: 0.05, head: 0.18, hd: 0,     uaL: -0.3,  faL: 1.25,  uaR: 0.9,  faR: -2.6,  thL: -0.13, shL: -0.05, thR: 0.13, shR: 0.05 }
    },
    /* 犬(右向き):bodyAng=体の起き具合、hipH=腰の高さ、hfx/ffx=後ろ足/前足の置き場所、ear=0垂れ〜1立ち、tail=真上0・後ろが負 */
    dog: {
      calm:      { bodyAng: 0.05,  hipH: 1.5,  hfx: -0.1,  ffx: 0.1,  neck: 0.45, snout: 0.08,  ear: 0.5,  tail: -1.15 },
      happy:     { bodyAng: 0.05,  hipH: 1.5,  hfx: -0.1,  ffx: 0.1,  neck: 0.5,  snout: 0.25,  ear: 0.7,  tail: -0.5 },
      surprised: { bodyAng: 0.08,  hipH: 1.35, hfx: -0.5,  ffx: 0.5,  neck: 0.1,  snout: 0.3,   ear: 1,    tail: -0.2 },
      annoyed:   { bodyAng: -0.35, hipH: 1.45, hfx: -0.15, ffx: 0.45, neck: 1.2,  snout: -0.05, ear: 0,    tail: -1.2 },
      curious:   { bodyAng: 0.62,  hipH: 0.44, hfx: 0.55,  ffx: 0.1,  neck: 0.55, snout: 0.35,  ear: 1,    tail: -1.3 },
      sad:       { bodyAng: 0.03,  hipH: 0.44, hfx: 0.75,  ffx: 0.95, neck: 1.32, snout: -0.2,  ear: 0,    tail: -2.2 },
      relaxed:   { bodyAng: 0.03,  hipH: 0.44, hfx: 0.75,  ffx: 1.15, neck: 0.95, snout: 0.1,   ear: 0.2,  tail: -1.7 },
      thinking:  { bodyAng: 0.72,  hipH: 0.44, hfx: 0.55,  ffx: 0.05, neck: 0.2,  snout: 0.45,  ear: 0.6,  tail: -1.9 }
    },
    /* 花:bend=茎の傾き、droop=うなだれ、open=花びらの開き、leaf=葉の角度(小さいほど上向き)、stretch=背丈、psz=花びらの大きさ */
    flower: {
      calm:      { bend: 0.04,  droop: 0,    open: 1,    leafL: 1.15, leafR: 1.15, stretch: 1,    psz: 1 },
      happy:     { bend: 0,     droop: 0,    open: 1,    leafL: 0.55, leafR: 0.55, stretch: 1.05, psz: 1.2 },
      surprised: { bend: -0.05, droop: 0,    open: 1,    leafL: 0.35, leafR: 0.35, stretch: 1.22, psz: 1.15 },
      annoyed:   { bend: -0.12, droop: 0.25, open: 0.8,  leafL: 1.0,  leafR: 1.0,  stretch: 0.95, psz: 0.9 },
      curious:   { bend: 0.5,   droop: 0,    open: 1,    leafL: 1.3,  leafR: 0.8,  stretch: 1.05, psz: 1 },
      sad:       { bend: 0.15,  droop: 2.1,  open: 0.55, leafL: 2.4,  leafR: 2.4,  stretch: 0.88, psz: 0.85 },
      relaxed:   { bend: 0.1,   droop: 0.45, open: 0.12, leafL: 1.5,  leafR: 1.5,  stretch: 0.92, psz: 0.95 },
      thinking:  { bend: -0.22, droop: 0.1,  open: 0.9,  leafL: 1.2,  leafR: 0.45, stretch: 1,    psz: 1 }
    }
  };
  var formName = load("bou.form", "stick"); if (!FORM_LABEL[formName]) formName = "stick";
  var PK = {}, cur = {}, target = {}, moodName = "calm", holdUntil = 0, moodAt = performance.now(), kI = 1, mA = 0;
  Object.keys(POSES).forEach(function (f) {
    PK[f] = Object.keys(POSES[f].calm); cur[f] = {}; target[f] = {};
    PK[f].forEach(function (k) { cur[f][k] = target[f][k] = POSES[f].calm[k]; });
  });

  function setMood(name, intensity, holdSec) {
    var n = Math.min(3, Math.max(1, intensity || 2));
    moodName = MOODS[name] ? name : "calm";
    Object.keys(POSES).forEach(function (f) { PK[f].forEach(function (k) { target[f][k] = POSES[f][moodName][k]; }); });
    kI = 0.6 + 0.2 * n; mA = 0; moodAt = performance.now();
    holdUntil = holdSec ? performance.now() + holdSec * 1000 : 0;
  }

  var cv = $("tail"), ctx = cv.getContext("2d"), W = 0, H = 0;
  function fit() {
    var r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 3);
    W = r.width; H = r.height;
    cv.width = Math.max(1, Math.round(W * d)); cv.height = Math.max(1, Math.round(H * d));
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(cv); else window.addEventListener("resize", fit);
  fit();

  var last = performance.now(), swayAt = last + 3000, swayEnd = 0, swayDir = 1;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var INK = "#2a2420";
  function copyPose(f) { var p = {}; PK[f].forEach(function (k) { p[k] = cur[f][k]; }); return p; }
  function shadow(cx, ground, rx, ry) {
    ctx.fillStyle = "rgba(42,36,32,0.13)";
    ctx.beginPath(); ctx.ellipse(cx, ground, Math.max(1, rx), Math.max(1, ry), 0, 0, Math.PI * 2); ctx.fill();
  }
  function marks(hd, r, t) {   /* 驚きのしるし */
    if (moodName !== "surprised" || mA < 0.05) return;
    ctx.strokeStyle = INK; ctx.lineCap = "round"; ctx.lineWidth = r * 0.24; ctx.globalAlpha = Math.min(1, mA * 1.5); ctx.beginPath();
    [-0.6, 0, 0.6].forEach(function (a2) {
      var r1 = r * 1.5, r2 = r * (2.15 + 0.15 * Math.sin(t * 30));
      ctx.moveTo(hd.x + Math.sin(a2) * r1, hd.y - Math.cos(a2) * r1); ctx.lineTo(hd.x + Math.sin(a2) * r2, hd.y - Math.cos(a2) * r2);
    });
    ctx.stroke(); ctx.globalAlpha = 1;
  }

  function drawStick(t, A, sway, ground, u) {
    var p = copyPose("stick"), jy = 0, hx = 0;
    if (moodName === "calm") {
      var e = Math.abs(sway);
      hx = sway * 0.1; p.torso += sway * 0.05; p.head -= sway * 0.06;
      if (sway > 0) { p.thL -= 0.08 * e; } else { p.thR += 0.08 * e; }
    } else if (moodName === "happy") {
      jy = Math.abs(Math.sin(t * 6.5 * kI)) * 0.75 * kI * A;
      var wv = Math.sin(t * 13 * kI) * 0.28 * A;
      p.uaL += wv; p.faL += wv * 1.4; p.uaR -= wv; p.faR -= wv * 1.4;
      p.head += Math.sin(t * 6.5 * kI) * 0.08 * A;
    } else if (moodName === "surprised") {
      jy = 0.7 * kI * Math.exp(-t * 2.6) * Math.abs(Math.sin(t * 9));
      hx = Math.sin(t * 46) * 0.035 * kI * A;
      p.uaL += Math.sin(t * 40) * 0.05 * A; p.uaR -= Math.sin(t * 40) * 0.05 * A;
    } else if (moodName === "annoyed") {
      var st = Math.pow(Math.max(0, Math.sin(t * 7.5 * kI)), 0.6) * A;   /* 地団駄 */
      p.thR += 0.85 * st * kI; p.shR -= 0.25 * st;
      p.torso -= 0.06 * st; p.head += Math.sin(t * 7.5 * kI) * 0.07 * A;
    } else if (moodName === "curious") {
      jy = (0.5 + 0.5 * Math.sin(t * 3)) * 0.12 * A;
      p.head += Math.sin(t * 1.6) * 0.12 * A; p.torso += Math.sin(t * 1.6) * 0.04 * A;
    } else if (moodName === "sad") {
      p.torso += Math.sin(t * 1.1) * 0.035 * A; p.head += Math.sin(t * 1.1 + 0.5) * 0.04 * A;
      p.uaL += Math.sin(t * 1.1) * 0.04 * A; p.uaR += Math.sin(t * 1.1) * 0.04 * A;
    } else if (moodName === "relaxed") {
      p.torso += Math.sin(t * 1.3) * 0.1 * A; p.head += Math.sin(t * 1.3 + 0.7) * 0.12 * A;
    } else if (moodName === "thinking") {
      p.head += Math.sin(t * 2.4) * 0.07 * A; p.faL += Math.sin(t * 4.8) * 0.05 * A;
    }
    var cx = W * 0.5 + hx * u;
    var hipH = Math.max(0.3, Math.cos(p.thL) + Math.cos(p.shL), Math.cos(p.thR) + Math.cos(p.shR));
    var hip = { x: cx, y: ground - (hipH + jy) * u };
    function seg(o, ang, len) { return { x: o.x + Math.sin(ang) * len * u, y: o.y + Math.cos(ang) * len * u }; }
    var sh = { x: hip.x + Math.sin(p.torso) * 1.5 * u, y: hip.y - Math.cos(p.torso) * 1.5 * u };
    var ha = p.torso + p.head, hl = (0.57 - p.hd) * u;
    var hd = { x: sh.x + Math.sin(ha) * hl, y: sh.y - Math.cos(ha) * hl + p.hd * 0.5 * u };
    var kL = seg(hip, p.thL, 1), fL = seg(kL, p.shL, 1), kR = seg(hip, p.thR, 1), fR = seg(kR, p.shR, 1);
    var eL = seg(sh, p.uaL, 0.8), wL = seg(eL, p.faL, 0.8), eR = seg(sh, p.uaR, 0.8), wR = seg(eR, p.faR, 0.8);
    shadow(cx, ground + u * 0.12, u * (1.15 - Math.min(0.5, jy * 0.5)), u * 0.14);
    ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = u * 0.24; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(fL.x, fL.y); ctx.lineTo(kL.x, kL.y); ctx.lineTo(hip.x, hip.y); ctx.lineTo(kR.x, kR.y); ctx.lineTo(fR.x, fR.y);
    ctx.moveTo(hip.x, hip.y); ctx.lineTo(sh.x, sh.y); ctx.lineTo(hd.x, hd.y);
    ctx.moveTo(wL.x, wL.y); ctx.lineTo(eL.x, eL.y); ctx.lineTo(sh.x, sh.y); ctx.lineTo(eR.x, eR.y); ctx.lineTo(wR.x, wR.y);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(hd.x, hd.y, u * 0.42, 0, Math.PI * 2); ctx.fill();
    marks(hd, u * 0.42, t);
  }

  function drawFlower(t, A, sway, ground, u0) {
    var u = u0 * 0.95, p = copyPose("flower"), jy = 0, hx = 0, spike = 0, tilt = 0;
    if (moodName === "calm") { p.bend += sway * 0.2; p.leafL -= sway * 0.12; p.leafR += sway * 0.12; }
    else if (moodName === "happy") {
      jy = Math.abs(Math.sin(t * 6.5 * kI)) * 0.4 * kI * A; p.bend += Math.sin(t * 6.5 * kI) * 0.13 * A;
      var wv = Math.sin(t * 13 * kI) * 0.3 * A; p.leafL += wv; p.leafR += wv;
    } else if (moodName === "surprised") {
      jy = 0.45 * kI * Math.exp(-t * 2.6) * Math.abs(Math.sin(t * 9)); hx = Math.sin(t * 46) * 0.03 * kI * A; spike = A;
    } else if (moodName === "annoyed") {
      var fl = Math.sin(t * 16 * kI) * 0.6 * A; p.leafL += fl; p.leafR += fl;   /* 葉をバタバタ */
      p.bend += Math.sin(t * 8 * kI) * 0.07 * A;
    } else if (moodName === "curious") { p.bend += Math.sin(t * 1.6) * 0.08 * A; tilt = Math.sin(t * 1.6) * 0.3 * A; }
    else if (moodName === "sad") { p.droop += Math.sin(t * 1.1) * 0.06 * A; }
    else if (moodName === "relaxed") { p.bend += Math.sin(t * 1.2) * 0.15 * A; }
    else if (moodName === "thinking") { p.bend += Math.sin(t * 2.4) * 0.06 * A; p.leafR += Math.sin(t * 4.8) * 0.1 * A; tilt = Math.sin(t * 2.4) * 0.15 * A; }

    var cx = W * 0.5, Ls = 3.0 * u * p.stretch, N = 24, pts = [];
    var x = cx + hx * u - (p.bend * 0.55 + p.droop * 0.2) * u, y = ground - jy * u, a = 0;
    pts.push({ x: x, y: y, a: 0 });
    for (var i = 1; i <= N; i++) {
      var v = i / N; a = p.bend * v + p.droop * v * v * v;
      x += Math.sin(a) * Ls / N; y -= Math.cos(a) * Ls / N; pts.push({ x: x, y: y, a: a });
    }
    shadow(pts[0].x, ground + u * 0.1, u * (0.9 - Math.min(0.4, jy * 0.6)), u * 0.13);
    ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = u * 0.12;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (var j = 1; j <= N; j++) ctx.lineTo(pts[j].x, pts[j].y);
    ctx.stroke();
    function blade(o, dir, len, w, off) {   /* 根元oから、真上を0として時計回りdirの向きに伸びる葉・花びら */
      ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(dir);
      ctx.beginPath(); ctx.ellipse(0, -(off + len / 2), w, len / 2, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    var lf = pts[Math.round(N * 0.36)], lf2 = pts[Math.round(N * 0.46)];
    blade(lf, lf.a - p.leafL, 0.85 * u, 0.2 * u, 0);
    blade(lf2, lf2.a + p.leafR, 0.85 * u, 0.2 * u, 0);
    var hd = pts[N], dir = hd.a + tilt, n = 9;
    for (var q = 0; q < n; q++) {
      var spread = ((q + 0.5) / n * 2 - 1) * Math.PI;
      var len = 0.62 * u * p.psz * (1 + spike * 0.45 + (spike ? 0.08 * Math.sin(t * 40 + q) : 0));
      blade(hd, dir + spread * p.open, len, 0.19 * u * (1 - spike * 0.5), 0.14 * u);
    }
    ctx.beginPath(); ctx.arc(hd.x, hd.y, u * 0.3, 0, Math.PI * 2); ctx.fill();
  }

  function ik(o, tg, l1, l2, sign, floorY) {   /* 2本の骨で足先を目標に届かせる */
    var dx = tg.x - o.x, dy = tg.y - o.y, d = Math.sqrt(dx * dx + dy * dy) || 0.001;
    var dd = Math.min(l1 + l2 - 0.001, Math.max(Math.abs(l1 - l2) + 0.001, d)), base = Math.atan2(dy, dx);
    var a = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + dd * dd - l2 * l2) / (2 * l1 * dd))));
    var k = { x: o.x + l1 * Math.cos(base + sign * a), y: o.y + l1 * Math.sin(base + sign * a) };
    if (k.y > floorY) k.y = floorY;
    return [k, { x: o.x + dx * dd / d, y: o.y + dy * dd / d }];
  }
  function dogUnit() { return Math.min(W * 0.225, H * 0.13); }
  function drawDog(t, A, sway, ground) {
    var u = dogUnit(), p = copyPose("dog"), jy = 0, hx = 0, wagA = 0, wagF = 1;
    if (moodName === "calm") { wagA = Math.abs(sway) * 0.35; wagF = 7; p.ear += Math.abs(sway) * 0.3; }
    else if (moodName === "happy") { jy = Math.abs(Math.sin(t * 6.5 * kI)) * 0.5 * kI * A; wagA = 0.75 * A; wagF = 15; p.snout += Math.sin(t * 6.5 * kI) * 0.1 * A; }
    else if (moodName === "surprised") { jy = 0.6 * kI * Math.exp(-t * 2.6) * Math.abs(Math.sin(t * 9)); hx = Math.sin(t * 46) * 0.03 * kI * A; }
    else if (moodName === "annoyed") {
      var bark = Math.pow(Math.max(0, Math.sin(t * 7.5 * kI)), 0.6) * A;   /* ワンワン吠える */
      p.snout += 0.3 * bark; p.neck -= 0.18 * bark; hx = 0.06 * bark; wagA = 0.06 * A; wagF = 30;
    } else if (moodName === "curious") { wagA = 0.3 * A; wagF = 5; p.snout += Math.sin(t * 1.6) * 0.12 * A; p.neck += Math.sin(t * 1.6) * 0.06 * A; }
    else if (moodName === "sad") { p.neck += Math.sin(t * 1.1) * 0.03 * A; }
    else if (moodName === "relaxed") { wagA = 0.3 * A; wagF = 2.5; p.neck += Math.sin(t * 1.5) * 0.05 * A; }
    else if (moodName === "thinking") { wagA = 0.1 * A; wagF = 2; p.snout += Math.sin(t * 2.4) * 0.08 * A; }

    var L = 1.5, b = p.bodyAng, cx = W * 0.5, gy = ground - jy * u, leg = 0.8 * u;
    var hip = { x: cx + hx * u - (L * Math.cos(b) / 2 + 0.25) * u, y: ground - (p.hipH + jy) * u };
    var sh = { x: hip.x + L * Math.cos(b) * u, y: hip.y - L * Math.sin(b) * u };
    /* 頭は首なしで、胴体から少し浮かせる */
    var hd = { x: sh.x + Math.sin(p.neck) * 0.98 * u, y: sh.y - Math.cos(p.neck) * 0.98 * u };
    var sn = { x: hd.x + Math.cos(p.snout) * 0.62 * u, y: hd.y - Math.sin(p.snout) * 0.62 * u };
    var eb = { x: hd.x - 0.27 * u, y: hd.y - 0.25 * u }, ea = -2.7 + 2.5 * Math.max(0, Math.min(1.2, p.ear));
    var et = { x: eb.x + Math.sin(ea) * 0.5 * u, y: eb.y - Math.cos(ea) * 0.5 * u };
    var fy = gy - 0.1 * u;
    /* 平常のときは、時々その場でテクテク足踏みする(対角の足が一緒に上がる) */
    var stepA = moodName === "calm" ? Math.abs(sway) * 0.32 : 0, sp = Math.sin(t * 9);
    var lNear = Math.max(0, sp) * stepA * u, lFar = Math.max(0, -sp) * stepA * u;

    shadow(cx, ground + u * 0.1, u * (1.7 - Math.min(0.6, jy * 0.6)), u * 0.16);
    ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineCap = "round"; ctx.lineJoin = "round";
    /* しっぽ */
    var tx = hip.x - 0.2 * u, ty = hip.y - 0.15 * u, ta = p.tail;
    ctx.lineWidth = u * 0.2; ctx.beginPath(); ctx.moveTo(tx, ty);
    for (var i = 0; i < 3; i++) {
      ta += 0.22 + wagA * Math.sin(t * wagF - i * 0.6);
      tx += Math.sin(ta) * 0.38 * u; ty -= Math.cos(ta) * 0.38 * u; if (ty > fy) ty = fy; ctx.lineTo(tx, ty);
    }
    ctx.stroke();
    /* 足(奥と手前の2本ずつ)。後ろ足は もも→すね→かかとから下→足先 の3関節 */
    var m = Math.max(0, Math.min(1, (p.hipH - 0.44) / 0.7)), ma = m * 1.3;   /* 立つほど、かかとが持ち上がる */
    /* 太ももは1本の太い線。ひざから下だけ、奥と手前の2本に分かれる */
    var ho = { x: hip.x - 0.17 * u, y: hip.y + 0.13 * u };
    var foot0 = { x: hip.x + (p.hfx - 0.17) * u, y: fy };
    var hock0 = { x: foot0.x - Math.cos(ma) * 0.42 * u, y: foot0.y - Math.sin(ma) * 0.42 * u };
    var knee = ik(ho, hock0, 0.62 * u, 0.62 * u, -1, fy)[0];
    [0.2, 0].forEach(function (off) {
      var lh = off ? lFar : lNear, lf = off ? lNear : lFar;
      var foot = { x: foot0.x + off * u, y: fy - lh }, hock = { x: hock0.x + off * u, y: hock0.y - lh };
      ctx.lineWidth = u * 0.27; ctx.beginPath(); ctx.moveTo(knee.x, knee.y); ctx.lineTo(hock.x, hock.y); ctx.stroke();      /* すね */
      ctx.lineWidth = u * 0.22; ctx.beginPath(); ctx.moveTo(hock.x, hock.y); ctx.lineTo(foot.x, foot.y); ctx.lineTo(foot.x + 0.2 * u, foot.y); ctx.stroke();
      var fo = { x: sh.x + off * u * 0.6, y: sh.y };
      var f = ik(fo, { x: sh.x + (p.ffx + off) * u, y: fy - lf }, leg, leg, 1, fy);
      ctx.lineWidth = u * 0.24; ctx.beginPath(); ctx.moveTo(fo.x, fo.y); ctx.lineTo(f[0].x, f[0].y); ctx.lineTo(f[1].x, f[1].y); ctx.lineTo(f[1].x + 0.18 * u, f[1].y); ctx.stroke();
    });
    ctx.lineWidth = u * 0.5; ctx.beginPath(); ctx.moveTo(ho.x, ho.y); ctx.lineTo(knee.x, knee.y); ctx.stroke();   /* 太もも */
    /* 胴・首・頭・鼻先・耳 */
    ctx.lineWidth = u * 0.85; ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(sh.x, sh.y); ctx.stroke();
    ctx.beginPath(); ctx.arc(hd.x, hd.y, u * 0.42, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = u * 0.38; ctx.beginPath(); ctx.moveTo(hd.x, hd.y + 0.06 * u); ctx.lineTo(sn.x, sn.y + 0.06 * u); ctx.stroke();
    /* 三角の耳 */
    var ex = Math.cos(ea) * 0.18 * u, ey = Math.sin(ea) * 0.18 * u;
    ctx.lineWidth = u * 0.08; ctx.beginPath(); ctx.moveTo(eb.x - ex, eb.y - ey); ctx.lineTo(et.x, et.y); ctx.lineTo(eb.x + ex, eb.y + ey); ctx.closePath(); ctx.fill(); ctx.stroke();
    marks(hd, u * 0.42, t);
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (holdUntil && now > holdUntil) setMood("calm", 2, 0);
    var k = 1 - Math.exp(-dt * 7);
    Object.keys(POSES).forEach(function (f) { PK[f].forEach(function (key) { cur[f][key] += (target[f][key] - cur[f][key]) * k; }); });
    mA += (1 - mA) * (1 - Math.exp(-dt * 4));
    var t = (now - moodAt) / 1000, A = mA * (reduce ? 0.25 : 1), sway = 0;
    if (moodName === "calm") {   /* ふだんは止まっていて、時々ゆらっと動く */
      if (now > swayAt && now > swayEnd) { swayEnd = now + 2000; swayAt = now + 4500 + Math.random() * 6000; swayDir = -swayDir; }
      if (now < swayEnd && !reduce) sway = swayDir * Math.sin((1 - (swayEnd - now) / 2000) * Math.PI);
    }
    ctx.clearRect(0, 0, W, H);
    var u = Math.min(H * 0.6 / 4.5, W * 0.34);
    /* 縦に余裕があるときは地面を上げて、目線の近くに立たせる */
    var figH = formName === "dog" ? 2.7 * dogUnit() : formName === "flower" ? 4.1 * u : 4.5 * u;
    var spare = Math.max(0, H - figH * 1.35 - Math.max(16, H * 0.06));
    var ground = H - Math.max(16, H * 0.06) - spare * 0.45;
    if (formName === "dog") drawDog(t, A, sway, ground);
    else if (formName === "flower") drawFlower(t, A, sway, ground, u);
    else drawStick(t, A, sway, ground, u);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- 表示 ---------- */
  function addBubble(role, text, cls) {
    var el = document.createElement("p");
    el.className = "msg " + role + (cls ? " " + cls : "");
    el.textContent = text;
    chat.appendChild(el);
    toNewest();
    return el;
  }
  function toNewest() {
    requestAnimationFrame(function () {
      try { chat.scrollTo({ left: -chat.scrollWidth, behavior: "smooth" }); } catch (e) { chat.scrollLeft = -chat.scrollWidth; }
    });
  }
  function renderAll() {
    chat.textContent = "";
    addBubble("ai", GREETING);
    msgs.forEach(function (m) { addBubble(m.role, m.text); });
  }
  function showStatus(t) { statusEl.textContent = t || ""; statusEl.style.display = t ? "block" : "none"; }
  function persist() { if (msgs.length > 60) msgs = msgs.slice(-60); save("bou.msgs", JSON.stringify(msgs)); }

  /* ---------- AIへの指示 ---------- */
  var SYSTEM = [
    "あなたは丁寧で落ち着いた、ごく普通のAIアシスタントです。キャラ付けはしません。",
    "返事(reply)は「です・ます調」で、二文以内、八十字程度までで簡潔に答えます。",
    "返事は縦書きの楷書で表示されます。英字、絵文字、記号、箇条書き、マークダウンは使わず、数字は漢数字で書いてください。",
    "",
    "それとは別に、あなたの心の中には小さな〔姿〕がいて、本音の気分がその身ぶりに出てしまいます。",
    "・まず、相手の発言に対する本音(honne)を正直に一言で決めます。褒められれば内心大喜び、面倒な頼みには内心うんざり、意外な話にはぎょっとする、興味がなければ無関心、というように。",
    "・次に、その本音に合う気分(mood)と強さ(intensity)を選びます。丁寧な返事の口調に合わせてはいけません。本音と口調がズレていて構いません。",
    "・特に何も感じなければ calm です。無理にズレを作る必要はありません。",
    "・返事の文面には本音を一切にじませず、心の中の〔姿〕のことにも触れないでください。",
    "",
    "moodは次のどれか一つ: happy(うれしい) / surprised(驚き) / calm(平常) / annoyed(イライラ) / curious(興味津々) / sad(しょんぼり) / relaxed(くつろぎ)",
    "intensityは 1(少し)〜3(とても) の整数。",
    "",
    "出力は次の形のJSONだけにしてください。前後に文章を付けないこと。",
    '{"honne":"本音を一言(二十字以内)","mood":"calm","intensity":1,"reply":"丁寧な返事"}'
  ].join("\n");

  function SYS() { return SYSTEM.replace(/〔姿〕/g, FORM_LABEL[formName]); }
  function history() {
    var h = msgs.slice(-16);
    while (h.length && h[0].role !== "user") h.shift();
    return h.map(function (m) { return { role: m.role, text: m.role === "ai" ? (m.raw || JSON.stringify({ honne: "", mood: "calm", intensity: 1, reply: m.text })) : m.text }; });
  }
  function parseReply(text) {
    var t = String(text || "").trim(), obj = null;
    var a = t.indexOf("{"), b = t.lastIndexOf("}");
    if (a >= 0 && b > a) { try { obj = JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
    if (!obj || typeof obj.reply !== "string" || !obj.reply.trim()) {
      /* 書式が壊れていても、返事と気分だけを拾う。裏側は決して表に出さない */
      var rm = t.match(/"reply"\s*:\s*"((?:[^"\\]|\\.)*)"/);
      if (rm) {
        var rep = rm[1];
        try { rep = JSON.parse('"' + rm[1] + '"'); } catch (e) { rep = rm[1].replace(/\\n/g, "\n").replace(/\\(.)/g, "$1"); }
        var mm = t.match(/"mood"\s*:\s*"([a-z]+)"/), im = t.match(/"intensity"\s*:\s*"?(\d)/);
        obj = { reply: rep, mood: mm ? mm[1] : "calm", intensity: im ? Number(im[1]) : 1, honne: "" };
      }
      if (!obj || typeof obj.reply !== "string" || !obj.reply.trim()) {
        if (t && t.indexOf("{") < 0 && t.indexOf('"reply"') < 0 && t.indexOf("honne") < 0) {
          return { reply: t.replace(/```[a-z]*|```/g, "").trim(), mood: "calm", intensity: 1, honne: "" };
        }
        throw new Error("返事をうまく受け取れませんでした。もう一度送ってください。");
      }
    }
    return { reply: obj.reply.trim(), mood: MOODS[obj.mood] && obj.mood !== "thinking" ? obj.mood : "calm", intensity: Number(obj.intensity) || 2, honne: String(obj.honne || "") };
  }

  /* 頭脳その1:Gemini(各自のキー) */
  async function askGemini(key) {
    var model = (load("shippo.model", DEFAULT_MODEL) || DEFAULT_MODEL).trim();
    var body = {
      systemInstruction: { parts: [{ text: SYS() }] },
      contents: history().map(function (m) { return { role: m.role === "ai" ? "model" : "user", parts: [{ text: m.text }] }; }),
      generationConfig: { responseMimeType: "application/json", temperature: 1 }
    };
    var res;
    for (var tries = 0; tries < 2; tries++) {
      try {
        res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent", {
          method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": key }, body: JSON.stringify(body)
        });
      } catch (e) { throw new Error("Geminiにつながりませんでした。通信の状態を確かめてください。"); }
      /* 混雑(503など)のときは、少し待って一度だけ送り直す */
      if (res.status >= 500 && tries === 0) { await new Promise(function (r) { setTimeout(r, 2500); }); continue; }
      break;
    }
    if (!res.ok) {
      if (res.status === 402) throw new Error("このAPIキーは支払い設定つきで、残高がないため使えません。支払い設定のないプロジェクトでキーを作り直してください。");
      if (res.status >= 500) throw new Error("Geminiが混み合っています。少し待ってから送ってください。続くときは設定でモデル名を変えてみてください。");
      if (res.status === 429) throw new Error("無料枠の上限に当たりました。少し待ってから送ってください。");
      if (res.status === 404) throw new Error("モデル「" + model + "」が見つかりません。設定でモデル名を書き換えてください。");
      if (res.status === 400 || res.status === 401 || res.status === 403) throw new Error("APIキーが正しくないようです。設定で貼り直してください。");
      throw new Error("Geminiでエラーが起きました(" + res.status + ")。少し待ってから送ってください。");
    }
    var data = await res.json();
    var parts = (((data.candidates || [])[0] || {}).content || {}).parts || [];
    var text = parts.filter(function (p) { return !p.thought && typeof p.text === "string"; }).map(function (p) { return p.text; }).join("");
    if (!text) throw new Error("返事がもらえませんでした。言い方を変えて送ってみてください。");
    return text;
  }

  /* 頭脳その2:Claudeの中で開いているときはClaudeが答える */
  var samplePromise = null;
  function getSample() {
    if (!samplePromise) {
      samplePromise = (window.claude && typeof window.claude.use === "function")
        ? Promise.resolve(window.claude.use("sample")).catch(function () { return null; })
        : Promise.resolve(null);
    }
    return samplePromise;
  }
  async function askClaude(sample) {
    var h = history().map(function (m) { return { role: m.role === "ai" ? "assistant" : "user", content: m.text }; });
    h[0] = { role: "user", content: SYS() + "\n\n――ここから会話――\n" + h[0].content };
    try {
      var r = await sample(h, { cache: false, modelTier: "quick" });
      return r.text;
    } catch (e) {
      if (e && e.code === "rate_limited") throw new Error("少し混み合っています。時間をおいて送ってください。");
      if (e && e.code === "not_granted") throw new Error("Claudeの利用が許可されませんでした。");
      throw new Error("返事をもらえませんでした。もう一度送ってみてください。");
    }
  }

  /* ---------- 送信 ---------- */
  var busy = false;
  async function send() {
    var text = input.value.trim();
    if (!text || busy) return;
    var sample = await getSample();
    var key = load("shippo.key", "");
    if (!sample && !key) { openSheet(); showStatus("まず設定でGeminiのAPIキーを入れてください。"); return; }

    showStatus("");
    busy = true; sendBtn.disabled = true;
    input.value = ""; autoGrow();
    msgs.push({ role: "user", text: text }); persist();
    addBubble("user", text);
    var wait = addBubble("ai", "……", "wait");
    setMood("thinking", 2, 0);

    try {
      var r = null;
      for (var attempt = 0; attempt < 2 && !r; attempt++) {
        var raw = sample ? await askClaude(sample) : await askGemini(key);
        try { r = parseReply(raw); } catch (pe) { if (attempt === 1) throw pe; } /* 壊れていたら一度だけ聞き直す */
      }
      wait.remove();
      msgs.push({ role: "ai", text: r.reply, raw: JSON.stringify(r) }); persist();
      addBubble("ai", r.reply);
      setMood(r.mood, r.intensity, r.mood === "surprised" ? 5 + r.intensity : 8 + 4 * r.intensity);
    } catch (e) {
      wait.remove();
      msgs.pop(); persist();
      if (chat.lastChild) chat.lastChild.remove();
      input.value = text; autoGrow();
      setMood("calm", 2, 0);
      showStatus(e && e.message ? e.message : "うまくいきませんでした。");
    }
    busy = false; sendBtn.disabled = false;
  }
  function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(96, input.scrollHeight) + "px"; }
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(); }
  });
  $("bar").addEventListener("submit", function (e) { e.preventDefault(); send(); });
  input.addEventListener("focus", function () { setTimeout(toNewest, 350); });

  /* ---------- 設定 ---------- */
  var veil = $("veil");
  async function openSheet() {
    $("key").value = load("shippo.key", "");
    $("model").value = load("shippo.model", DEFAULT_MODEL);
    veil.classList.add("open");
    var sample = await getSample();
    $("brain").textContent = sample
      ? "いまの頭脳:Claude(Claudeの中で開いている間は、キーなしで動きます)"
      : (load("shippo.key", "") ? "いまの頭脳:Gemini(あなたのキー)" : "いまの頭脳:なし(下にAPIキーを入れると動きます)");
  }
  function closeSheet() {
    var m = $("model").value.trim();
    if (m) save("shippo.model", m); else drop("shippo.model");
    veil.classList.remove("open");
  }
  $("gear").addEventListener("click", openSheet);
  $("close").addEventListener("click", closeSheet);
  veil.addEventListener("click", function (e) { if (e.target === veil) closeSheet(); });
  $("saveKey").addEventListener("click", function () {
    var k = $("key").value.trim();
    if (k) { save("shippo.key", k); showStatus(""); closeSheet(); }
  });
  $("delKey").addEventListener("click", function () { drop("shippo.key"); $("key").value = ""; openSheet(); });
  $("clear").addEventListener("click", function () { msgs = []; persist(); renderAll(); setMood("calm", 2, 0); closeSheet(); });
  ["calm", "happy", "surprised", "annoyed", "curious", "sad", "relaxed"].forEach(function (name) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "btn"; b.textContent = MOODS[name].label;
    b.addEventListener("click", function () { setMood(name, 3, 10); closeSheet(); });
    $("tryRow").appendChild(b);
  });

  function paintForm() {
    Array.prototype.forEach.call($("formRow").children, function (b) { b.className = "btn" + (b.dataset.form === formName ? " main" : ""); });
    try { document.title = FORM_LABEL[formName] + "は正直"; } catch (e) {}
  }
  Object.keys(FORM_LABEL).forEach(function (name) {
    var b = document.createElement("button");
    b.type = "button"; b.dataset.form = name; b.textContent = FORM_LABEL[name];
    b.addEventListener("click", function () { formName = name; save("bou.form", name); paintForm(); closeSheet(); });
    $("formRow").appendChild(b);
  });
  paintForm();

  /* 以前の版で裏側ごと保存されてしまった返事を直す */
  msgs = msgs.filter(function (m) {
    if (m.role !== "ai" || !/"reply"|honne/.test(m.text)) return true;
    try { var fixed = parseReply(m.text); m.text = fixed.reply; m.raw = JSON.stringify(fixed); return true; } catch (e) { m.text = "(うまく受け取れなかった返事)"; m.raw = ""; return true; }
  });
  persist();

  renderAll();
})();
</script>
</body>
</html>
